name: Temp Fix Global Typecheck

on:
  push:
    branches:
      - feature/projeto-rh-especificacao-funcional
    paths:
      - .github/workflows/temp-fix-global-typecheck.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/projeto-rh-especificacao-funcional
          fetch-depth: 0
      - name: Synchronize exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/projeto-rh-especificacao-funcional
          git reset --hard origin/feature/projeto-rh-especificacao-funcional
          echo "FIX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only
      - name: Apply residual deterministic fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f"{path}: esperado 1 match, encontrado {count}")
              p.write_text(text.replace(old,new,1))

          # Amostra visual usa os summaries explícitos já declarados no arquivo.
          p=Path('app/amostra-launcher/page.tsx'); text=p.read_text()
          text=text.replace('import type { Indicador } from "@/lib/casca/indicadores";\n','')
          start=text.find('// Esta é a página de **amostra visual**')
          end=text.find('export default async function Amostra', start)
          if start < 0 or end < 0: raise SystemExit('amostra-launcher: bloco legado não localizado')
          text=text[:start]+'// Esta é a página de amostra visual; os valores abaixo pertencem somente a RESUMOS_DEMONSTRACAO.\n\n'+text[end:]
          if '<Launcher aplicativos={aplicativos} indicadores={INDICADORES_DA_AMOSTRA} />' not in text: raise SystemExit('amostra-launcher: chamada antiga não encontrada')
          text=text.replace('<Launcher aplicativos={aplicativos} indicadores={INDICADORES_DA_AMOSTRA} />','<Launcher aplicativos={aplicativos} resumos={RESUMOS_DEMONSTRACAO} />')
          p.write_text(text)

          # Summary progress é opcional no contrato do domínio.
          replace_once('components/casca/launcher.tsx','function MiniGrafico({ progress }: { progress: number | null }) {','function MiniGrafico({ progress }: { progress?: number | null }) {')

          # Env vars permanecem obrigatórias em runtime, mas são strings estáveis para o TypeScript.
          p=Path('tests/e2e/rh-professional-smoke.spec.ts'); text=p.read_text()
          old='const base=process.env.RH_E2E_BASE_URL?.replace(/\\/$/,"");const email=process.env.RH_E2E_EMAIL;const password=process.env.RH_E2E_PASSWORD;'
          new='const base=process.env.RH_E2E_BASE_URL?.replace(/\\/$/,"")??"";const email=process.env.RH_E2E_EMAIL??"";const password=process.env.RH_E2E_PASSWORD??"";'
          if text.count(old)!=1: raise SystemExit('smoke e2e: declaração de credenciais não encontrada')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Run global typecheck after residual fixes
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck 2>&1 | tee /tmp/typecheck.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit residual fixes if branch did not move
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/projeto-rh-especificacao-funcional
          remote_head="$(git rev-parse origin/feature/projeto-rh-especificacao-funcional)"
          if [ "$remote_head" != "$FIX_HEAD" ]; then
            echo "Branch mudou durante a correção: $FIX_HEAD -> $remote_head. Abortando commit obsoleto." >&2
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/amostra-launcher/page.tsx components/casca/launcher.tsx tests/e2e/rh-professional-smoke.spec.ts
          git commit -m 'fix: fecha resíduos de typecheck do launcher e e2e'
          git push origin HEAD:feature/projeto-rh-especificacao-funcional
      - name: Require clean global typecheck
        shell: bash
        run: |
          test '${{ steps.typecheck.outputs.status }}' = '0'
