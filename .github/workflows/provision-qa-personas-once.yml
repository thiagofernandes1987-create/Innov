name: Provision QA Personas Once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: homologation
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      QA_PERSONAS_JSON: ${{ secrets.QA_PERSONAS_JSON }}
      QA_ORGANIZATION_ID: ${{ vars.QA_ORGANIZATION_ID }}
      ALLOW_INSECURE_DEMO_USERS: "true"
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Provision authenticated QA personas
        run: pnpm provision:qa-personas
