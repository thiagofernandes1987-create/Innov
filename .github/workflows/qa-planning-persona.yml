name: QA Planejamento por Persona

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-planning-persona-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gestor-de-obras:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PREVIEW_URL: https://innov-g79hg3qg6-apex-method.vercel.app?_vercel_share=QFl6Z8HvmCQ31L91p6VyroAJlmxGW2oS
      QA_PERSONAS_JSON: ${{ secrets.QA_PERSONAS_JSON }}
      QA_OUTPUT_DIR: artifacts/planning-persona
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Run gestor de obras journey
        run: node scripts/run-planning-persona-qa.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: planning-persona-${{ github.run_id }}
          path: artifacts/planning-persona/
          if-no-files-found: warn
          retention-days: 30
