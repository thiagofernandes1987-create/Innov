name: RH eSocial Parser

on:
  pull_request:
    paths:
      - "lib/rh/integrations/esocial-result-parser.ts"
      - "tests/rh/esocial-result-parser.test.ts"
      - ".github/workflows/rh-esocial-parser.yml"
  push:
    branches:
      - "feature/**"
    paths:
      - "lib/rh/integrations/esocial-result-parser.ts"
      - "tests/rh/esocial-result-parser.test.ts"
      - ".github/workflows/rh-esocial-parser.yml"

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only
      - name: Parser tests
        run: pnpm exec vitest run tests/rh/esocial-result-parser.test.ts
