name: Registrar VACINA-044

on:
  push:
    branches:
      - qa/planejamento-iter1

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: qa/planejamento-iter1
          fetch-depth: 0

      - name: Register vaccine in canonical catalog
        run: node scripts/register-vaccine-044.mjs

      - name: Commit catalog update
        run: |
          if git diff --quiet -- diretrizes/VACINAS.md; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diretrizes/VACINAS.md
          git commit -m "docs(vacina): inclui VACINA-044 no catálogo"
          git push origin HEAD:qa/planejamento-iter1
