name: Module Visual QA

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: URL imutável do preview Vercel
        required: true
        type: string
      module_key:
        description: Chave do módulo em lib/modules/registry.ts
        required: true
        type: string
      module_route:
        description: Rota autenticada a capturar
        required: true
        type: string
      persona:
        description: Persona configurada em QA_PERSONAS_JSON
        required: true
        default: administrador
        type: string
      ref:
        description: Branch, tag ou commit correspondente ao preview
        required: true
        default: fix/module-validation-loop-20260730
        type: string
  pull_request:
    paths:
      - "diretrizes/qa/ALVO-CAPTURA-ATUAL.json"
      - "scripts/run-module-visual-qa.mjs"
      - ".github/workflows/module-visual-qa.yml"

permissions:
  contents: read

concurrency:
  group: module-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      QA_PERSONAS_JSON: ${{ secrets.QA_PERSONAS_JSON }}
      DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
      DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
      DEMO_CLIENT_EMAIL: ${{ secrets.DEMO_CLIENT_EMAIL }}
      DEMO_CLIENT_PASSWORD: ${{ secrets.DEMO_CLIENT_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      INPUT_PREVIEW_URL: ${{ inputs.preview_url }}
      INPUT_MODULE_KEY: ${{ inputs.module_key }}
      INPUT_MODULE_ROUTE: ${{ inputs.module_route }}
      INPUT_PERSONA: ${{ inputs.persona }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.head_ref }}

      - name: Resolve capture target
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const dispatch = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
          const target = dispatch
            ? {
                enabled: true,
                previewUrl: process.env.INPUT_PREVIEW_URL,
                moduleKey: process.env.INPUT_MODULE_KEY,
                moduleRoute: process.env.INPUT_MODULE_ROUTE,
                persona: process.env.INPUT_PERSONA
              }
            : JSON.parse(fs.readFileSync('diretrizes/qa/ALVO-CAPTURA-ATUAL.json', 'utf8'));
          if (!target.enabled) throw new Error('Alvo de captura está desabilitado.');
          for (const key of ['previewUrl', 'moduleKey', 'moduleRoute', 'persona']) {
            if (!target[key]) throw new Error(`Alvo de captura sem ${key}.`);
          }
          const output = process.env.GITHUB_ENV;
          fs.appendFileSync(output, `PREVIEW_URL=${target.previewUrl}\n`);
          fs.appendFileSync(output, `MODULE_KEY=${target.moduleKey}\n`);
          fs.appendFileSync(output, `MODULE_ROUTE=${target.moduleRoute}\n`);
          fs.appendFileSync(output, `QA_PERSONA=${target.persona}\n`);
          fs.appendFileSync(output, `QA_OUTPUT_DIR=artifacts/module-visual-qa/${target.moduleKey}\n`);
          console.log(JSON.stringify(target, null, 2));
          NODE

      - name: Validate requested module
        run: |
          node scripts/validate-module-qa.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const inventory = JSON.parse(fs.readFileSync('diretrizes/qa/VALIDACAO-MODULOS.json', 'utf8'));
          const moduleKey = process.env.MODULE_KEY;
          const route = process.env.MODULE_ROUTE;
          const moduleEntry = inventory.modules.find(item => item.modulo === moduleKey);
          if (!moduleEntry) throw new Error(`Módulo ausente do inventário: ${moduleKey}`);
          if (!route.startsWith('/app') && !route.startsWith('/cliente')) throw new Error(`Rota QA inválida: ${route}`);
          console.log(JSON.stringify({ moduleKey, route, persona: process.env.QA_PERSONA }, null, 2));
          NODE

      - name: Install Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Capture preview matrix 375 768 1280
        run: node scripts/run-module-visual-qa.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-visual-qa-${{ env.MODULE_KEY }}-${{ github.run_id }}
          path: artifacts/module-visual-qa/${{ env.MODULE_KEY }}/
          if-no-files-found: warn
          retention-days: 30
