name: Patch route provider messages (temporary)

on:
  push:
    branches:
      - audit/regressao-main-20260808
    paths:
      - ".github/workflows/patch-route-provider-messages.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/regressao-main-20260808

      - name: Remove raw WhatsApp provider message
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('app/api/webhooks/whatsapp/route.ts')
          src=p.read_text()
          replacements=[
            (
              '  errors?: Array<{ code?: number; title?: string; message?: string }>;',
              '  errors?: Array<{ code?: number; title?: string }>;'
            ),
            (
              '''          const firstError = status.errors?.[0];\n          const patch: Record<string, unknown> = {\n            status: nextStatus,\n            error_code: firstError?.code ? String(firstError.code) : null,\n            error_message: firstError?.title ?? firstError?.message ?? null\n          };''',
              '''          const providerFailure = status.errors?.[0];\n          const patch: Record<string, unknown> = {\n            status: nextStatus,\n            error_code: providerFailure?.code ? String(providerFailure.code) : null,\n            error_message: providerFailure?.title ?? null\n          };'''
            ),
            (
              '''              error_code: firstError?.code ? String(firstError.code) : null,\n              error_title: firstError?.title ?? null,''',
              '''              error_code: providerFailure?.code ? String(providerFailure.code) : null,\n              error_title: providerFailure?.title ?? null,'''
            )
          ]
          for old,new in replacements:
            count=src.count(old)
            if count!=1:
              raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
            src=src.replace(old,new,1)
          p.write_text(src)
          PY

      - name: Verify every Route Handler provider boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const safe=new Set(['validationError','responseFailure']);
          const findings=[];
          function walk(dir){
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()){walk(full);continue;}
              if(!entry.isFile()||!/^route\.tsx?$/.test(entry.name))continue;
              const src=fs.readFileSync(full,'utf8');
              for(const match of src.matchAll(/\b([A-Za-z_$][A-Za-z0-9_$]*)\??\.message\b/g)){
                const variable=match[1];
                if((variable==='error'||variable.endsWith('Error'))&&!safe.has(variable)){
                  const line=src.slice(0,match.index).split('\n').length;
                  findings.push(`${full}:${line}:${match[0]}`);
                }
              }
            }
          }
          walk('app');
          if(findings.length){console.error(findings.join('\n'));process.exit(1);}
          console.log('Route Handler provider boundary: PASS');
          NODE

      - name: Commit WhatsApp webhook hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/webhooks/whatsapp/route.ts
          git commit -m "security: stop persisting raw whatsapp provider messages"
          git push origin HEAD:audit/regressao-main-20260808
