name: Aplicar áreas do Planejamento iter2

on:
  push:
    branches:
      - qa/planejamento-iter1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: qa/planejamento-iter1
          fetch-depth: 0

      - name: Apply exact patch
        run: node scripts/patch-planning-hit-area-iter2.mjs

      - name: Commit interaction correction
        run: |
          if git diff --quiet -- components/planejamento/schedule-planner.tsx components/planejamento/schedule-planner.module.css; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/planejamento/schedule-planner.tsx components/planejamento/schedule-planner.module.css
          git commit -m "fix(schedule): amplia alvos sem distorcer duração visual"
          git push origin HEAD:qa/planejamento-iter1
