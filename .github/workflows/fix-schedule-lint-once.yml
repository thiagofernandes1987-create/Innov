name: Fix Schedule Lint Once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-schedule-lint-once.yml

permissions:
  contents: write

concurrency:
  group: fix-schedule-lint-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/projeto-rh-especificacao-funcional
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Remove unused hit geometry declarations and validate
        shell: bash
        run: |
          set -euo pipefail
          branch=feature/projeto-rh-especificacao-funcional
          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/planejamento/schedule-planner.tsx')
          text=p.read_text()
          targets=[
              '                    const hitWidth = Math.max(44, visualWidth);\n',
              '                    const hitOffset = (hitWidth - visualWidth) / 2;\n',
          ]
          for target in targets:
              count=text.count(target)
              if count != 1:
                  raise SystemExit(f'declaração esperada exatamente 1x, encontrada {count}: {target.strip()}')
              text=text.replace(target,'',1)
          p.write_text(text)
          PY
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
          pnpm install --no-frozen-lockfile --reporter=append-only
          pnpm exec eslint components/planejamento/schedule-planner.tsx --max-warnings=0
          git rm .github/workflows/fix-schedule-lint-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/planejamento/schedule-planner.tsx
          git diff --cached --check
          git commit -m 'fix(planning): remove geometria de hit não usada do Gantt'
          git push origin "HEAD:$branch"
