name: Diagnose persisted provider errors (temporary)

on:
  push:
    branches:
      - audit/regressao-main-20260808
    paths:
      - ".github/workflows/diagnose-persisted-provider-errors.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/regressao-main-20260808
      - name: Record technical error field usage
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const roots=['app','lib','scripts'];
          const wanted=/\b(error_message|last_error|failure_reason|provider_error|error_details)\b/i;
          const extensions=/\.(?:ts|tsx|js|mjs|cjs)$/;
          const findings=[];
          function walk(dir){
            if(!fs.existsSync(dir))return;
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()){walk(full);continue;}
              if(!entry.isFile()||!extensions.test(entry.name))continue;
              const lines=fs.readFileSync(full,'utf8').split('\n');
              for(let i=0;i<lines.length;i++){
                if(wanted.test(lines[i])) findings.push(`${full}:${i+1}:${lines[i].trim()}`);
              }
            }
          }
          for(const root of roots)walk(root);
          fs.writeFileSync('diretrizes/tmp-persisted-provider-error-audit.txt',findings.length?findings.join('\n')+'\n':'ZERO\n');
          console.log(`PERSISTED_PROVIDER_ERROR_FINDINGS=${findings.length}`);
          NODE
      - name: Commit short diagnostic report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add diretrizes/tmp-persisted-provider-error-audit.txt
          git commit -m "chore: record temporary persisted provider error audit"
          git push origin HEAD:audit/regressao-main-20260808
