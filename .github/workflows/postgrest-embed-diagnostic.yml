name: PostgREST Embed Diagnostic

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "components/**"
      - "supabase/migrations/**"
      - "scripts/validate-postgrest-embeds.mjs"
      - ".github/workflows/postgrest-embed-diagnostic.yml"
  push:
    branches: ["feature/**"]
    paths:
      - "app/**"
      - "lib/**"
      - "components/**"
      - "supabase/migrations/**"
      - "scripts/validate-postgrest-embeds.mjs"
      - ".github/workflows/postgrest-embed-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run PostgREST embed validator
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-postgrest-embeds.mjs 2>&1 | tee postgrest-embeds-validation.txt
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgrest-embeds-validation-${{ github.run_id }}
          path: postgrest-embeds-validation.txt
          if-no-files-found: error
          retention-days: 2
