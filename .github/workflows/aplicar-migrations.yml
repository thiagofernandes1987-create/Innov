# Aplica as migrations pendentes no banco, pelo runner.
#
# Por que aqui e não numa sessão assistida: `SUPABASE_DB_URL` é segredo do
# repositório e existe no runner, não no contêiner de quem desenvolve. Aplicar
# pelo MCP significaria colar 0,88 MB de SQL em 121 chamadas, e parar no meio de
# 121 migrations ordenadas deixa o banco num estado que nem o repositório nem o
# ledger descrevem.
#
# O padrão é `workflow_dispatch`: **nunca dispara sozinho**. Aplicar migration é
# ação externa e irreversível, e a decisão é de quem clica.
#
# O modo padrão é `conferir`, que imprime o plano e não toca no banco. Para
# aplicar de verdade é preciso, além de escolher `aplicar`, digitar a palavra de
# confirmação — o mesmo cuidado que o `stage20-backup-restore-drill` já usa para
# alvo descartável.

name: aplicar-migrations

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "conferir imprime o plano e não toca no banco; aplicar executa"
        required: true
        default: conferir
        type: choice
        options:
          - conferir
          - aplicar
          - recriar
      confirmacao:
        description: "aplicar exige APLICAR; recriar exige RECRIAR DO ZERO. Qualquer outra coisa recusa."
        required: false
        default: ""
        type: string
      ate:
        description: "Limita o lote às N primeiras. Vazio aplica o lote inteiro."
        required: false
        default: ""
        type: string
      com_destrutivas:
        description: "Inclui as que perdem dado. Só com decisão registrada."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    # Declarar o ambiente faz o job enxergar **os dois lugares**: os segredos de
    # repositório e os do ambiente `homologation`, que é onde o
    # `stage20-backup-restore-drill` guarda os dele.
    #
    # Sem esta linha, um segredo criado em Environments é invisível aqui — e o
    # sintoma é exatamente o mesmo de segredo inexistente, porque o GitHub
    # expande os dois como string vazia (VACINA-069). Em 13/08/2026 essa
    # ambiguidade custou três disparos até a causa ficar clara.
    environment: homologation
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Recusar aplicação sem confirmação explícita
        if: inputs.modo == 'aplicar'
        run: |
          if [ "${{ inputs.confirmacao }}" != "APLICAR" ]; then
            echo "::error::Modo 'aplicar' exige a confirmação literal APLICAR. Nada foi enviado ao banco."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL não está configurada neste repositório."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Antes de tudo, inclusive antes de instalar o cliente: para onde este
      # segredo aponta? A S-79 custou dois dias de trabalho num projeto que não
      # era o desta plataforma, e o alvo nunca foi impresso porque ninguém
      # imprime um segredo. Este passo imprime o `project_ref` — que já está
      # versionado — e recusa quando ele não bate com `diretrizes/BANCO-ALVO.json`.
      # `--exigir` é o que diferencia este lugar do terminal de quem desenvolve.
      # Rodar `--conferir` sem credencial é uso legítimo na máquina de alguém:
      # olha-se o plano sem tocar no banco. **Aqui não é.** Este workflow existe
      # para falar com o banco, e o segredo é injetado pelo runner.
      #
      # Sem `--exigir`, o primeiro disparo real (12/08/2026, run 31651934504)
      # saiu VERDE com `SUPABASE_DB_URL:` vazio — porque o GitHub expande
      # segredo indefinido como string vazia, em silêncio. Um passo chamado
      # "conferir para onde o segredo aponta" que aprova quando não há segredo
      # é exatamente o portão que não mede nada.
      - name: Conferir para onde SUPABASE_DB_URL aponta
        run: |
          set -o pipefail
          node scripts/banco-alvo.mjs --conferir --exigir | tee alvo-conferido.txt

      - name: Instalar psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # `recriar` apaga o schema `public` inteiro e o histórico de migrations,
      # e aplica as 273 do repositório em ordem. Decidido pelo proprietário em
      # 13/08/2026: o banco tinha 49 migrations aplicadas sem arquivo nenhum no
      # repositório, e aplicar as 178 pendentes por cima colidiria em
      # `already exists` — que é o que deixou a branch em MIGRATIONS_FAILED.
      #
      # Duas confirmações, e de propósito: a do formulário (`RECRIAR DO ZERO`) e
      # a do script (`--confirmar RECRIAR`). Não há ponto de retorno.
      - name: Recusar recriação sem confirmação explícita
        if: inputs.modo == 'recriar'
        run: |
          if [ "${{ inputs.confirmacao }}" != "RECRIAR DO ZERO" ]; then
            echo "::error::Modo 'recriar' exige a confirmação literal 'RECRIAR DO ZERO'. Nada foi enviado ao banco."
            exit 1
          fi

      # A prévia roda **também no modo `conferir`**, e a razão é de desenho: na
      # primeira versão ela só era alcançável pedindo `recriar`, ou seja, quem
      # quisesse ver o que seria apagado precisava antes armar a operação que
      # apaga. Prévia que exige armar a bomba não é prévia.
      - name: Conferir o que seria apagado
        if: inputs.modo == 'recriar' || inputs.modo == 'conferir'
        run: |
          set -o pipefail
          node scripts/recriar-banco-do-zero.mjs --conferir | tee estado-antes-do-reset.txt

      - name: Recriar o banco do zero
        if: inputs.modo == 'recriar'
        run: |
          set -o pipefail
          node scripts/recriar-banco-do-zero.mjs --recriar --confirmar RECRIAR | tee resultado-do-reset.txt

      - name: Aplicar as 273 em ordem
        if: inputs.modo == 'recriar'
        run: |
          set -o pipefail
          node scripts/aplicar-migrations-pendentes.mjs --aplicar --todas --com-destrutivas | tee resultado-de-migrations.txt

      # O plano lê o ledger, e depois de `recriar` o ledger ainda descreve o
      # banco de antes. Imprimi-lo ali seria um relatório correto sobre um
      # estado que deixou de existir.
      - name: Plano
        if: inputs.modo != 'recriar'
        run: |
          set -o pipefail
          node scripts/aplicar-migrations-pendentes.mjs --conferir | tee plano-de-migrations.txt

      - name: Aplicar
        if: inputs.modo == 'aplicar'
        run: |
          set -o pipefail
          args=(--aplicar)
          [ -n "${{ inputs.ate }}" ] && args+=(--ate "${{ inputs.ate }}")
          [ "${{ inputs.com_destrutivas }}" = "true" ] && args+=(--com-destrutivas)
          node scripts/aplicar-migrations-pendentes.mjs "${args[@]}" | tee resultado-de-migrations.txt

      - name: Estado do ledger depois
        if: always() && (inputs.modo == 'aplicar' || inputs.modo == 'recriar')
        run: node scripts/atualizar-ledger-de-migrations.mjs | tee ledger-depois.txt || true

      - name: Guardar evidência
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-de-migrations
          path: |
            alvo-conferido.txt
            estado-antes-do-reset.txt
            resultado-do-reset.txt
            plano-de-migrations.txt
            resultado-de-migrations.txt
            ledger-depois.txt
          if-no-files-found: warn
          retention-days: 30
