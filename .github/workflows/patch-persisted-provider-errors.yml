name: Patch persisted provider errors (temporary)

on:
  push:
    branches:
      - audit/regressao-main-20260808
    paths:
      - ".github/workflows/patch-persisted-provider-errors.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/regressao-main-20260808
      - name: Apply exact reviewed replacements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(file, old, new):
              p=Path(file)
              src=p.read_text()
              count=src.count(old)
              if count!=1:
                  raise SystemExit(f"{file}: expected exactly one occurrence, found {count}: {old[:120]!r}")
              p.write_text(src.replace(old,new,1))

          # SINAPI: provider/database messages never become batch error_message.
          f='lib/sinapi/automatic-update.ts'
          replace_once(f,
              'import { createClient } from "@supabase/supabase-js";\n',
              'import { createClient } from "@supabase/supabase-js";\nimport { reportDataAccessError } from "@/lib/errors/data-access";\n')
          replace_once(f,
              '    if (error) throw new Error(`Falha ao importar insumos SINAPI: ${error.message}`);',
              '    if (error) { reportDataAccessError("sinapi.automatic.inputs", error); throw new Error("SINAPI_INPUT_IMPORT_FAILED"); }')
          replace_once(f,
              '    if (error) throw new Error(`Falha ao importar composições SINAPI: ${error.message}`);',
              '    if (error) { reportDataAccessError("sinapi.automatic.compositions", error); throw new Error("SINAPI_COMPOSITION_IMPORT_FAILED"); }')
          replace_once(f,
              '  if (latestError) throw new Error(`Falha ao consultar o estado atual do SINAPI: ${latestError.message}`);',
              '  if (latestError) { reportDataAccessError("sinapi.automatic.latest-batch", latestError); throw new Error("SINAPI_LATEST_BATCH_FAILED"); }')
          replace_once(f,
              '    if (startError || !startedBatchId) throw new Error(startError?.message ?? "O lote SINAPI não foi iniciado.");',
              '    if (startError) { reportDataAccessError("sinapi.automatic.start-batch", startError); throw new Error("SINAPI_START_BATCH_FAILED"); }\n    if (!startedBatchId) throw new Error("SINAPI_START_BATCH_EMPTY");')
          replace_once(f,
              '    if (claimedError) throw new Error(`Falha ao confirmar o lote SINAPI: ${claimedError.message}`);',
              '    if (claimedError) { reportDataAccessError("sinapi.automatic.claim-batch", claimedError); throw new Error("SINAPI_CLAIM_BATCH_FAILED"); }')
          replace_once(f,
              '    if (finishError || !finished) throw new Error(finishError?.message ?? "O lote SINAPI não foi finalizado.");',
              '    if (finishError) { reportDataAccessError("sinapi.automatic.finish-batch", finishError); throw new Error("SINAPI_FINISH_BATCH_FAILED"); }\n    if (!finished) throw new Error("SINAPI_FINISH_BATCH_EMPTY");')
          replace_once(f,
              '''        await supabase.rpc("finish_sinapi_import", {\n          p_batch_id: batchId,\n          p_error_message: error instanceof Error ? error.message : "Falha desconhecida na atualização automática."\n        });''',
              '''        const { error: failureFinishError } = await supabase.rpc("finish_sinapi_import", {\n          p_batch_id: batchId,\n          p_error_message: "SINAPI_IMPORT_FAILED"\n        });\n        if (failureFinishError) reportDataAccessError("sinapi.automatic.fail-batch", failureFinishError);''')

          # Workspace never needs the persisted text; status + stable code are enough.
          replace_once('lib/whatsapp/server.ts',
              '"id,direction,message_type,status,body,caption,source_binding_id,source_snapshot,error_code,error_message,occurred_at"',
              '"id,direction,message_type,status,body,caption,source_binding_id,source_snapshot,error_code,occurred_at"')

          # Meta webhook persists only stable numeric code, not provider-authored text.
          f='app/api/webhooks/whatsapp/route.ts'
          replace_once(f,
              '            error_message: providerFailure?.title ?? null',
              '            error_message: null')
          replace_once(f,
              '              error_title: providerFailure?.title ?? null,',
              '              error_title: null,')

          print('Persisted-provider writer patch applied.')
          PY

      - name: Verify persistence boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const conversion=fs.readFileSync('scripts/run-signature-conversion-worker.mjs','utf8');
          const delivery=fs.readFileSync('scripts/run-signature-delivery-worker.mjs','utf8');
          const sinapi=fs.readFileSync('lib/sinapi/automatic-update.ts','utf8');
          const whatsapp=fs.readFileSync('lib/whatsapp/server.ts','utf8');
          const webhook=fs.readFileSync('app/api/webhooks/whatsapp/route.ts','utf8');
          const checks=[
            [!conversion.includes('p_error:message'),'conversion worker raw persisted message'],
            [!conversion.includes('error:message'),'conversion worker raw logged message'],
            [!delivery.includes('p_error:message'),'delivery worker raw persisted message'],
            [!delivery.includes('error:message'),'delivery worker raw logged message'],
            [sinapi.includes('p_error_message: "SINAPI_IMPORT_FAILED"'),'SINAPI stable failed-batch code'],
            [!sinapi.includes('p_error_message: error instanceof Error'),'SINAPI raw persisted message'],
            [!whatsapp.includes('error_code,error_message,occurred_at'),'WhatsApp workspace error_message read'],
            [webhook.includes('error_message: null'),'WhatsApp webhook stable persistence'],
            [webhook.includes('error_title: null'),'WhatsApp status event stable persistence']
          ];
          const failed=checks.filter(([ok])=>!ok).map(([,label])=>label);
          if(failed.length){console.error(failed.join('\n'));process.exit(1);}
          console.log('Persisted-provider boundary: PASS');
          NODE

      - name: Commit hardened writers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add lib/sinapi/automatic-update.ts lib/whatsapp/server.ts app/api/webhooks/whatsapp/route.ts
          git commit -m "security: stop persisting raw provider failures"
          git push origin HEAD:audit/regressao-main-20260808
