name: RH eSocial Generation

on:
  pull_request:
    paths:
      - "lib/rh/integrations/esocial-*.ts"
      - "app/actions/rh-esocial-*.ts"
      - "app/actions/rh-admission-esocial.ts"
      - "app/actions/rh-payroll-esocial.ts"
      - "app/actions/rh-termination-esocial.ts"
      - "app/app/rh/obrigacoes/esocial/**"
      - "app/app/rh/admissoes/**"
      - "supabase/migrations/*_rh_esocial_*.sql"
      - "supabase/migrations/*_rh_admission_esocial_*.sql"
      - "tests/rh/esocial-*.ts"
      - "tsconfig.rh.json"
      - ".github/workflows/rh-esocial-generation.yml"
  push:
    branches:
      - "feature/**"
    paths:
      - "lib/rh/integrations/esocial-*.ts"
      - "app/actions/rh-esocial-*.ts"
      - "app/actions/rh-admission-esocial.ts"
      - "app/actions/rh-payroll-esocial.ts"
      - "app/actions/rh-termination-esocial.ts"
      - "app/app/rh/obrigacoes/esocial/**"
      - "app/app/rh/admissoes/**"
      - "tests/rh/esocial-*.ts"
      - ".github/workflows/rh-esocial-generation.yml"

permissions:
  contents: read

concurrency:
  group: rh-esocial-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation-signature-xsd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-build-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ESOCIAL_XSD_DIR: /tmp/esocial-xsd
      ESOCIAL_XSD_URL: https://www.gov.br/esocial/pt-br/documentacao-tecnica/manuais/2026-07-01_esquemas_xsd_v_s_01_03_00.zip
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only
      - name: Install XML validators and XMLDSig verifier
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils xmlsec1 openssl unzip
      - name: Download official eSocial S-1.3 XSD package
        run: |
          rm -rf "$ESOCIAL_XSD_DIR" /tmp/esocial-xsd.zip
          mkdir -p "$ESOCIAL_XSD_DIR"
          curl --fail --silent --show-error --location "$ESOCIAL_XSD_URL" --output /tmp/esocial-xsd.zip
          unzip -q /tmp/esocial-xsd.zip -d "$ESOCIAL_XSD_DIR"
          test "$(find "$ESOCIAL_XSD_DIR" -type f -name '*.xsd' | wc -l)" -gt 0
          xmlsec1 --version
      - name: Validate migrations
        run: pnpm validate:migrations
      - name: Test XML generation, XMLDSig, XMLSec and official XSD
        run: pnpm exec vitest run tests/rh/esocial-generation-signature.test.ts tests/rh/esocial-periodic-termination.test.ts tests/rh/esocial-xmlsec-interoperability.test.ts
      - name: RH scoped typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.rh.json
      - name: RH eSocial lint
        run: pnpm exec eslint lib/rh/integrations/esocial-*.ts app/actions/rh-esocial-*.ts app/actions/rh-admission-esocial.ts app/actions/rh-payroll-esocial.ts app/actions/rh-termination-esocial.ts app/app/rh/obrigacoes/esocial app/app/rh/admissoes tests/rh/esocial-*.ts --max-warnings=0
