name: Repair Project Error Messages

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: repair-project-errors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Replace raw database messages in project actions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const file = "app/actions/projects.ts";
          let source = fs.readFileSync(file, "utf8");
          const pattern = /fail\(([^,\n]+), error\.message\);/g;
          const matches = [...source.matchAll(pattern)];
          if (matches.length !== 10) {
            throw new Error(`Esperadas 10 mensagens cruas no HEAD auditado; encontradas ${matches.length}.`);
          }
          source = source.replace(
            pattern,
            (_match, target) => `failProjectDatabase(${target}, "project-write", error, "Não foi possível concluir a operação.");`
          );
          if (/fail\(([^,\n]+), error\.message\);/.test(source)) {
            throw new Error("Ainda restou mensagem crua de banco em projects.ts.");
          }
          fs.writeFileSync(file, source);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Run affected contracts
        run: pnpm exec vitest run tests/planning-task-integration.test.ts tests/project-membership-resolution.test.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Commit hardened project actions
        shell: bash
        run: |
          if git diff --quiet -- app/actions/projects.ts; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/actions/projects.ts
          git commit -m "fix(projects): não expõe mensagens cruas do banco"
          git push origin HEAD:${{ github.head_ref }}
