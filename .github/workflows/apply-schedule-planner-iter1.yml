name: Aplicar patch do Planejamento iter1

on:
  push:
    branches:
      - qa/planejamento-iter1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: qa/planejamento-iter1
          fetch-depth: 0

      - name: Apply exact patch
        run: node scripts/patch-schedule-planner-iter1.mjs

      - name: Commit component correction
        run: |
          if git diff --quiet -- components/planejamento/schedule-planner.tsx; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/planejamento/schedule-planner.tsx
          git commit -m "fix(schedule): corrige estado do modal e precisão dos campos"
          git push origin HEAD:qa/planejamento-iter1
