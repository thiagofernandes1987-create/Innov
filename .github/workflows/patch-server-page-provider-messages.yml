name: Patch server page provider messages (temporary)

on:
  push:
    branches:
      - audit/regressao-main-20260808
    paths:
      - ".github/workflows/patch-server-page-provider-messages.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/regressao-main-20260808

      - name: Apply exact reviewed replacements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(file, old, new):
              p = Path(file)
              src = p.read_text()
              count = src.count(old)
