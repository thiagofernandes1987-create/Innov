      - name: Verify Server Component boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const safe = new Set(['validationError', 'responseFailure']);
          const findings = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(full); continue; }
              if (!entry.isFile() || !/^page\.tsx?$/.test(entry.name)) continue;
              const src = fs.readFileSync(full, 'utf8');
              if (/^\s*["']use client["'];/.test(src)) continue;
              for (const match of src.matchAll(/\b([A-Za-z_$][A-Za-z0-9_$]*)\??\.message\b/g)) {
                const variable = match[1];
                if ((variable === 'error' || variable.endsWith('Error')) && !safe.has(variable)) {
                  const line = src.slice(0, match.index).split('\n').length;
                  findings.push(`${full}:${line}:${match[0]}`);
                }
              }
            }
          }
          walk('app');
          if (findings.length) {
            console.error(findings.join('\n'));
            process.exit(1);
          }
          for (const file of [
            'app/app/assinaturas/page.tsx',
            'app/app/assinaturas/documentos/[id]/page.tsx',
            'app/app/orcamentos/sinapi/page.tsx'
          ]) {
            const src = fs.readFileSync(file, 'utf8');
            if (/\blast_error\b|\berror_message\b/.test(src)) {
              console.error(`${file}: technical persisted error field remains in UI source`);
              process.exit(1);
            }
          }
          console.log('Server Component provider boundary: PASS');
          NODE

      - name: Commit hardened pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "security: sanitize provider errors across server pages"
          git push origin HEAD:audit/regressao-main-20260808
