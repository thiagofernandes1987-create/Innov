name: QA Fixture Pública do Launcher

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-public-launcher-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PREVIEW_URL: ${{ vars.QA_PUBLIC_PREVIEW_URL }}
      QA_OUTPUT_DIR: artifacts/public-launcher-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate fresh public preview
        shell: bash
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::QA público bloqueado: configure QA_PUBLIC_PREVIEW_URL com a URL atual de /amostra-launcher acessível sem login."
            exit 1
          fi

      - name: Install Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Capture public launcher fixture
        run: node scripts/run-public-launcher-fixture-qa.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-launcher-fixture-${{ github.run_id }}
          path: artifacts/public-launcher-fixture/
          if-no-files-found: warn
          retention-days: 30
