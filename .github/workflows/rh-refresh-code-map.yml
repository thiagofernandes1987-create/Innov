name: RH Refresh Code Map

on:
  push:
    branches:
      - feature/projeto-rh-especificacao-funcional
    paths:
      - .github/workflows/rh-refresh-code-map.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/projeto-rh-especificacao-funcional
          fetch-depth: 0
      - name: Synchronize exact branch head before generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/projeto-rh-especificacao-funcional
          git reset --hard origin/feature/projeto-rh-especificacao-funcional
          echo "GENERATION_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Gerando mapa final sobre $GENERATION_HEAD"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only
      - name: Generate and verify canonical code map
        run: |
          pnpm mapa:codigo
          pnpm validate:code-map
      - name: Commit generated map only if branch did not move
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- diretrizes/MAPA-DO-CODIGO.md; then
            echo 'Mapa já estava atualizado.'
            exit 0
          fi
          git fetch origin feature/projeto-rh-especificacao-funcional
          remote_head="$(git rev-parse origin/feature/projeto-rh-especificacao-funcional)"
          if [ "$remote_head" != "$GENERATION_HEAD" ]; then
            echo "Branch mudou durante a geração: $GENERATION_HEAD -> $remote_head. Abortando artefato obsoleto." >&2
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diretrizes/MAPA-DO-CODIGO.md
          git commit -m 'docs: regenera mapa canônico do código'
          git push origin HEAD:feature/projeto-rh-especificacao-funcional
