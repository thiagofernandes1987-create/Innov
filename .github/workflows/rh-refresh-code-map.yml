name: RH Refresh Code Map

on:
  push:
    branches:
      - feature/projeto-rh-especificacao-funcional
    paths:
      - .github/workflows/rh-refresh-code-map.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/projeto-rh-especificacao-funcional
          fetch-depth: 0
      - name: Synchronize exact branch head before generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/projeto-rh-especificacao-funcional
          git reset --hard origin/feature/projeto-rh-especificacao-funcional
          echo "GENERATION_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only
      - name: Align TSVE page with current server action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/app/rh/tsv/[id]/page.tsx')
          text=p.read_text()
          old_import='import { generateS2300, saveTsvEsocialProfile } from "@/app/actions/rh-tsv-esocial";'
          new_import='import { generateTsvS2300, saveTsvEsocialProfile } from "@/app/actions/rh-tsv-esocial";'
          old_action='form action={generateS2300}'
          new_action='form action={generateTsvS2300}'
          if text.count(old_import)!=1:
              raise SystemExit(f'import antigo esperado 1x, encontrado {text.count(old_import)}')
          if text.count(old_action)!=1:
              raise SystemExit(f'action antiga esperada 1x, encontrado {text.count(old_action)}')
          p.write_text(text.replace(old_import,new_import,1).replace(old_action,new_action,1))
          PY
      - name: Verify RH typecheck after TSVE alignment
        run: pnpm exec tsc --noEmit -p tsconfig.rh.json
      - name: Generate and verify canonical code map
        run: |
          pnpm mapa:codigo
          pnpm validate:code-map
      - name: Commit TSVE alignment and generated map if inputs stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/projeto-rh-especificacao-funcional
          remote_head="$(git rev-parse origin/feature/projeto-rh-especificacao-funcional)"
          if [ "$remote_head" != "$GENERATION_HEAD" ]; then
            changed="$(git diff --name-only "$GENERATION_HEAD" "$remote_head")"
            echo "Branch moveu durante a geração:"; printf '%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -Ev '^(\.github/|docs/)' | grep -q .; then
              echo 'Entrada mapeada mudou; abortando artefato obsoleto.' >&2
              exit 2
            fi
            git reset --hard "$remote_head"
            python3 - <<'PY'
          from pathlib import Path
          p=Path('app/app/rh/tsv/[id]/page.tsx')
          text=p.read_text()
          old_import='import { generateS2300, saveTsvEsocialProfile } from "@/app/actions/rh-tsv-esocial";'
          new_import='import { generateTsvS2300, saveTsvEsocialProfile } from "@/app/actions/rh-tsv-esocial";'
          old_action='form action={generateS2300}'
          new_action='form action={generateTsvS2300}'
          if old_import in text: text=text.replace(old_import,new_import,1)
          if old_action in text: text=text.replace(old_action,new_action,1)
          p.write_text(text)
          PY
            pnpm exec tsc --noEmit -p tsconfig.rh.json
            pnpm mapa:codigo
            pnpm validate:code-map
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/app/rh/tsv/'[id]'/page.tsx diretrizes/MAPA-DO-CODIGO.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(rh): alinha S-2300 TSVE e regenera mapa'
          git push origin HEAD:feature/projeto-rh-especificacao-funcional
