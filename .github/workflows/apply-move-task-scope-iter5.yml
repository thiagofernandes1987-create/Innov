name: Aplicar escopo de tarefa iter5

on:
  push:
    branches:
      - qa/planejamento-iter1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: qa/planejamento-iter1
          fetch-depth: 0

      - name: Apply exact patch
        run: node scripts/patch-move-task-scope-iter5.mjs

      - name: Commit task scope correction
        run: |
          if git diff --quiet -- app/actions/projects.ts; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/actions/projects.ts
          git commit -m "fix(schedule): valida tarefa no escopo da obra antes de mover"
          git push origin HEAD:qa/planejamento-iter1
