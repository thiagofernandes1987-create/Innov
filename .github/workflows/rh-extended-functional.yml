name: RH Extended Functional

on:
  pull_request:
    paths:
      - "app/app/rh/**"
      - "app/api/rh/**"
      - "app/actions/rh-*.ts"
      - "lib/rh/**"
      - "supabase/migrations/*_rh_*.sql"
      - "supabase/tests/rh/**"
      - "tests/rh/**"
      - "tests/e2e/rh-*.spec.ts"
      - "scripts/run-rh-*.mjs"
      - "scripts/seed-rh-browser-e2e.mjs"
      - "scripts/verify-rh-browser-e2e.mjs"
      - "tsconfig.rh.json"
      - ".github/workflows/rh-extended-functional.yml"
      - ".github/workflows/rh-browser-e2e.yml"
  push:
    branches: ["feature/**"]
    paths:
      - "app/app/rh/**"
      - "app/api/rh/**"
      - "app/actions/rh-*.ts"
      - "lib/rh/**"
      - "supabase/migrations/*_rh_*.sql"
      - "supabase/tests/rh/**"
      - "tests/rh/**"
      - "tests/e2e/rh-*.spec.ts"
      - "scripts/run-rh-*.mjs"
      - "scripts/seed-rh-browser-e2e.mjs"
      - "scripts/verify-rh-browser-e2e.mjs"
      - ".github/workflows/rh-extended-functional.yml"
      - ".github/workflows/rh-browser-e2e.yml"

permissions:
  contents: read

concurrency:
  group: rh-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rh-extended:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-build-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SIGNATURE_PROVIDER: sandbox
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only
      - name: Validate menu routes
        run: pnpm validate:menus
      - name: Validate migrations
        run: pnpm validate:migrations
      - name: Run RH database regression suite
        run: pnpm test:db:rh
      - name: RH scoped typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.rh.json
      - name: Lint RH actions, pages, APIs, integrations and E2E harness
        run: pnpm exec eslint 'app/actions/rh-*.ts' app/app/rh app/api/rh lib/rh tests/rh 'tests/e2e/rh-*.spec.ts' scripts/seed-rh-browser-e2e.mjs scripts/verify-rh-browser-e2e.mjs --max-warnings=0
      - name: RH unit and contract suites
        run: pnpm exec vitest run tests/rh
