name: RH Extended Functional

on:
  pull_request:
    paths:
      - "app/app/rh/**"
      - "app/api/rh/**"
      - "app/actions/rh-*.ts"
      - "lib/rh/**"
      - "supabase/migrations/*_rh_*.sql"
      - "supabase/tests/rh/**"
      - "tests/rh/**"
      - "tests/e2e/rh-*.spec.ts"
      - "scripts/run-rh-*.mjs"
      - "scripts/seed-rh-browser-e2e.mjs"
      - "scripts/verify-rh-browser-e2e.mjs"
      - "tsconfig.rh.json"
      - ".github/workflows/rh-extended-functional.yml"
      - ".github/workflows/rh-browser-e2e.yml"
  push:
    branches: ["feature/**"]
    paths:
      - "app/app/rh/**"
      - "app/api/rh/**"
      - "app/actions/rh-*.ts"
      - "lib/rh/**"
      - "supabase/migrations/*_rh_*.sql"
      - "supabase/tests/rh/**"
      - "tests/rh/**"
      - "tests/e2e/rh-*.spec.ts"
      - "scripts/run-rh-*.mjs"
      - "scripts/seed-rh-browser-e2e.mjs"
      - "scripts/verify-rh-browser-e2e.mjs"
      - ".github/workflows/rh-extended-functional.yml"
      - ".github/workflows/rh-browser-e2e.yml"

permissions:
  contents: read

concurrency:
  group: rh-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rh-extended:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-build-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SIGNATURE_PROVIDER: sandbox
      ESOCIAL_XSD_URL: https://www.gov.br/esocial/pt-br/documentacao-tecnica/manuais/2026-07-01_esquemas_xsd_v_s_01_03_00.zip
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only
      - name: Load official eSocial S-1.3 XSD package and XML security tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxml2-utils xmlsec1 openssl unzip >/dev/null
          rm -rf .tmp/esocial-xsd /tmp/esocial-xsd.zip
          mkdir -p .tmp/esocial-xsd
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            "$ESOCIAL_XSD_URL" --output /tmp/esocial-xsd.zip
          unzip -q /tmp/esocial-xsd.zip -d .tmp/esocial-xsd
          xsd_count="$(find .tmp/esocial-xsd -type f -iname '*.xsd' | wc -l | tr -d ' ')"
          if [ "$xsd_count" -lt 1 ]; then
            echo 'Pacote oficial eSocial não contém XSDs.' >&2
            exit 1
          fi
          echo "Pacote oficial eSocial carregado: $xsd_count XSDs"
          sha256sum /tmp/esocial-xsd.zip
          xmlsec1 --version
          echo "ESOCIAL_XSD_DIR=$GITHUB_WORKSPACE/.tmp/esocial-xsd" >> "$GITHUB_ENV"
      - name: Validate menu routes
        run: pnpm validate:menus
      - name: Validate migrations
        run: pnpm validate:migrations
      - name: Run RH database regression suite
        run: pnpm test:db:rh
      - name: Run RH dedicated database suites
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-rh-esocial-results-db-tests.mjs
          node scripts/run-rh-government-db-tests.mjs
          node scripts/run-rh-time-db-tests.mjs
      - name: RH isolated backup and restore drill
        run: node scripts/run-rh-backup-restore-drill.mjs
      - name: RH scoped typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.rh.json
      - name: Lint RH actions, pages, APIs, integrations and test harnesses
        run: pnpm exec eslint 'app/actions/rh-*.ts' app/app/rh app/api/rh lib/rh tests/rh 'tests/e2e/rh-*.spec.ts' scripts/run-rh-backup-restore-drill.mjs scripts/seed-rh-browser-e2e.mjs scripts/verify-rh-browser-e2e.mjs --max-warnings=0
      - name: RH unit and contract suites with official eSocial XSD and XMLSec
        run: pnpm exec vitest run tests/rh
      - name: Upload RH restore evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rh-backup-restore-evidence-${{ github.run_id }}
          path: .evidence/rh/backup-restore-drill.json
          if-no-files-found: warn
          retention-days: 30
