name: Audit Orphan Surfaces

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: audit-orphans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Remove duplicated openTaskEditor implementation
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const file = "components/planejamento/schedule-planner.tsx";
          let source = fs.readFileSync(file, "utf8");
          const block = '  function openTaskEditor(taskId: string): void {\n    setEditorTab("general");\n    setEditorTaskId(taskId);\n  }\n\n';
          const first = source.indexOf(block);
          const second = first < 0 ? -1 : source.indexOf(block, first + block.length);
          if (first < 0 || second < 0) {
            throw new Error("Esperadas duas implementações idênticas de openTaskEditor.");
          }
          source = `${source.slice(0, first)}${source.slice(first + block.length)}`;
          if (source.indexOf(block) < 0 || source.indexOf(block, source.indexOf(block) + block.length) >= 0) {
            throw new Error("A normalização não resultou em exatamente uma implementação.");
          }
          fs.writeFileSync(file, source);
          NODE

      - name: Audit reachable code graph
        run: node scripts/auditar-alcancabilidade.mjs --json > reachability-audit.json

      - name: Audit unused server action symbols
        run: node scripts/auditar-server-actions-sem-chamada.mjs --json > server-actions-audit.json

      - name: Assert no unused server action symbols remain
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("server-actions-audit.json", "utf8"));
          if (report.unusedCount !== 0) {
            console.error(JSON.stringify(report.unused, null, 2));
            process.exit(1);
          }
          NODE

      - name: Audit Supabase surfaces without JS consumers
        continue-on-error: true
        run: node scripts/auditar-superficies-supabase.mjs --json > supabase-surface-audit.json

      - name: Validate canonical code map
        shell: bash
        run: |
          node scripts/gerar-mapa-do-codigo.mjs
          git diff --exit-code -- diretrizes/MAPA-DO-CODIGO.md

      - name: Commit TypeScript cleanup
        shell: bash
        run: |
          if git diff --quiet -- components/planejamento/schedule-planner.tsx; then
            echo "SchedulePlanner já possui uma única implementação."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/planejamento/schedule-planner.tsx
          git commit -m "fix(planning): remove implementação duplicada do editor"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload orphan audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orphan-surface-audit
          path: |
            reachability-audit.json
            server-actions-audit.json
            supabase-surface-audit.json
            diretrizes/MAPA-DO-CODIGO.md
          if-no-files-found: warn
          retention-days: 14
