name: Audit Orphan Surfaces

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: audit-orphans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Audit reachable code graph
        continue-on-error: true
        run: node scripts/auditar-alcancabilidade.mjs --json > reachability-audit.json

      - name: Audit unused server action symbols
        continue-on-error: true
        run: node scripts/auditar-server-actions-sem-chamada.mjs --json > server-actions-audit.json

      - name: Audit Supabase surfaces without JS consumers
        continue-on-error: true
        run: node scripts/auditar-superficies-supabase.mjs --json > supabase-surface-audit.json

      - name: Generate canonical code map
        run: node scripts/gerar-mapa-do-codigo.mjs

      - name: Commit generated code map when changed
        shell: bash
        run: |
          if git diff --quiet -- diretrizes/MAPA-DO-CODIGO.md; then
            echo "Mapa do código já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diretrizes/MAPA-DO-CODIGO.md
          git commit -m "docs(code-map): regenera mapa canônico"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload orphan audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orphan-surface-audit
          path: |
            reachability-audit.json
            server-actions-audit.json
            supabase-surface-audit.json
            diretrizes/MAPA-DO-CODIGO.md
          if-no-files-found: warn
          retention-days: 14
