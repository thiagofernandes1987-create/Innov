name: Audit Orphan Surfaces

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: audit-orphans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Remove confirmed orphan server actions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const projectsPath = "app/actions/projects.ts";
          let projects = fs.readFileSync(projectsPath, "utf8");
          const dependencyImport = 'import { createScheduleDependency } from "./schedule";';
          const dependencyStart = 'export async function createDependency(formData: FormData) {';
          const dependencyEnd = 'export async function createMilestone(formData: FormData) {';

          if (!projects.includes(dependencyImport)) {
            throw new Error("Import legado createScheduleDependency não encontrado em projects.ts.");
          }
          const dependencyStartIndex = projects.indexOf(dependencyStart);
          const dependencyEndIndex = projects.indexOf(dependencyEnd);
          if (dependencyStartIndex < 0 || dependencyEndIndex <= dependencyStartIndex) {
            throw new Error("Marcadores de createDependency não encontrados em projects.ts.");
          }
          projects = projects.replace(`${dependencyImport}\n`, "");
          const dependencyStartIndexAfterImport = projects.indexOf(dependencyStart);
          const dependencyEndIndexAfterImport = projects.indexOf(dependencyEnd);
          projects = `${projects.slice(0, dependencyStartIndexAfterImport)}${projects.slice(dependencyEndIndexAfterImport)}`;
          fs.writeFileSync(projectsPath, projects);

          const relationshipPath = "app/actions/relationship.ts";
          let relationship = fs.readFileSync(relationshipPath, "utf8");
          const crmStart = "export async function createCrmOpportunity";
          const crmEnd = "export async function moveCrmOpportunityStage";
          const crmStartIndex = relationship.indexOf(crmStart);
          const crmEndIndex = relationship.indexOf(crmEnd);
          if (crmStartIndex < 0 || crmEndIndex <= crmStartIndex) {
            throw new Error("Marcadores de createCrmOpportunity não encontrados em relationship.ts.");
          }
          relationship = `${relationship.slice(0, crmStartIndex)}${relationship.slice(crmEndIndex)}`;
          fs.writeFileSync(relationshipPath, relationship);
          NODE

      - name: Audit reachable code graph
        run: node scripts/auditar-alcancabilidade.mjs --json > reachability-audit.json

      - name: Audit unused server action symbols
        run: node scripts/auditar-server-actions-sem-chamada.mjs --json > server-actions-audit.json

      - name: Assert no unused server action symbols remain
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("server-actions-audit.json", "utf8"));
          if (report.unusedCount !== 0) {
            console.error(JSON.stringify(report.unused, null, 2));
            process.exit(1);
          }
          NODE

      - name: Audit Supabase surfaces without JS consumers
        continue-on-error: true
        run: node scripts/auditar-superficies-supabase.mjs --json > supabase-surface-audit.json

      - name: Generate canonical code map
        run: node scripts/gerar-mapa-do-codigo.mjs

      - name: Commit confirmed cleanup and generated map
        shell: bash
        run: |
          if git diff --quiet -- app/actions/projects.ts app/actions/relationship.ts diretrizes/MAPA-DO-CODIGO.md; then
            echo "Actions órfãs já removidas e mapa sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/actions/projects.ts app/actions/relationship.ts diretrizes/MAPA-DO-CODIGO.md
          git commit -m "refactor(dead-code): remove actions órfãs e regenera mapa"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload orphan audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orphan-surface-audit
          path: |
            reachability-audit.json
            server-actions-audit.json
            supabase-surface-audit.json
            diretrizes/MAPA-DO-CODIGO.md
          if-no-files-found: warn
          retention-days: 14
