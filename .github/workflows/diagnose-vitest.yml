name: Diagnose Vitest

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diagnose-vitest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Run Vitest with complete report
        id: vitest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test -- --reporter=verbose 2>&1 | tee vitest-report.txt

      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: vitest-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Preserve failing status
        if: steps.vitest.outcome == 'failure'
        run: exit 1
