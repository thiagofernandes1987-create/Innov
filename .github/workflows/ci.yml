name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-build-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SIGNATURE_PROVIDER: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Validate Stage 9 structure
        run: pnpm validate:stage9

      - name: Validate Stage 12 structure
        run: pnpm validate:stage12

      - name: Validate Stage 12.1 modular access
        run: pnpm validate:stage12.1

      - name: Validate Stage 12.2 advanced signatures
        run: pnpm validate:stage12.2

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build 2>&1 | tee build-stage12-2-current.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-stage12-2-current
          path: build-stage12-2-current.txt

      - name: Fail on build errors
        if: steps.build.outcome == 'failure'
        run: exit 1
