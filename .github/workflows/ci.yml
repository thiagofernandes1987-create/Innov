name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-build-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SIGNATURE_PROVIDER: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          pnpm install --no-frozen-lockfile --reporter=append-only > /tmp/pnpm-install.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- últimas linhas da instalação ---"
            tail -n 100 /tmp/pnpm-install.log
            exit "$status"
          fi
          cat /tmp/pnpm-install.log

      - name: Publish install diagnostic on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Diagnóstico temporário do CI"
            echo
            echo '```text'
            tail -n 100 /tmp/pnpm-install.log
            echo '```'
          } > /tmp/ci-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/ci-comment.md

      - name: Validate Stage 9 structure
        run: pnpm validate:stage9

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
