name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate canonical documentation
        run: node scripts/validate-documentation.mjs
      - name: Validate Stage 17 inventory
        run: |
          set -o pipefail
          node scripts/validate-stage17.mjs 2>&1 | tee stage17-validation.txt
      - name: Upload Stage 17 validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage17-validation
          path: stage17-validation.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload Stage 17 migrations
        uses: actions/upload-artifact@v4
        with:
          name: stage17-migrations
          path: supabase/migrations/2026072016*.sql
          if-no-files-found: error
          retention-days: 7

  quality:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-build-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SIGNATURE_PROVIDER: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only
      - name: Validate Stage 9 structure
        run: pnpm validate:stage9
      - name: Validate Stage 12 structure
        run: pnpm validate:stage12
      - name: Validate Stage 12.1 modular access
        run: pnpm validate:stage12.1
      - name: Validate Stage 12.2 advanced signatures
        run: pnpm validate:stage12.2
      - name: Validate Stage 13 quality forms
        run: pnpm validate:stage13
      - name: Validate Stage 14 procurement
        run: pnpm validate:stage14
      - name: Validate Stage 15 operational finance
        run: pnpm validate:stage15
      - name: Validate Stage 16 reports
        run: pnpm validate:stage16
      - name: Lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint-report.txt
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt
          if-no-files-found: error
          retention-days: 7
      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck-report.txt
      - name: Upload TypeScript report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck-report.txt
          if-no-files-found: error
          retention-days: 7
      - name: TypeScript unit tests
        run: pnpm test
      - name: Python quality form tests
        run: pnpm test:python
      - name: Build
        run: pnpm build
