name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "test/**"
      - "chore/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate canonical documentation
        run: |
          set -o pipefail
          node scripts/validate-documentation.mjs 2>&1 | tee documentation-validation.txt
      - name: Validate auditable persona contracts
        run: |
          set -o pipefail
          node scripts/validate-personas-audit.mjs 2>&1 | tee personas-audit-validation.txt
      - name: Validate module adjustment and capture inventory
        run: |
          set -o pipefail
          node scripts/validate-module-qa.mjs 2>&1 | tee module-qa-validation.txt
      - name: Validate engineering vaccines
        run: |
          set -o pipefail
          node scripts/validate-vaccines.mjs 2>&1 | tee vaccines-validation.txt
      - name: Validate extension function qualification
        run: |
          set -o pipefail
          node scripts/validate-extension-functions.mjs 2>&1 | tee extension-functions-validation.txt
      - name: Validate operational QA guards
        run: |
          set -o pipefail
          node scripts/validate-operational-qa-guards.mjs 2>&1 | tee operational-qa-validation.txt
      - name: Validate flexible commercial workflows
        run: |
          set -o pipefail
          node scripts/validate-flexible-commercial-workflows.mjs 2>&1 | tee flexible-workflows-validation.txt
      - name: Validate Supabase migration ledger
        run: |
          set -o pipefail
          node scripts/validate-supabase-migrations.mjs 2>&1 | tee migrations-validation.txt
      - name: Validate Stage 17 inventory
        run: |
          set -o pipefail
          node scripts/validate-stage17.mjs 2>&1 | tee stage17-validation.txt
      - name: Validate Stage 18 relationship
        run: |
          set -o pipefail
          node scripts/validate-stage18.mjs 2>&1 | tee stage18-validation.txt
      - name: Validate Stage 19 observability
        run: |
          set -o pipefail
          node scripts/validate-stage19.mjs 2>&1 | tee stage19-validation.txt
      - name: Validate Stage 20 production readiness
        run: |
          set -o pipefail
          node scripts/validate-stage20.mjs 2>&1 | tee stage20-validation.txt
      - name: Validate Stage 22 WhatsApp omnichannel
        run: |
          set -o pipefail
          node scripts/validate-stage22.mjs 2>&1 | tee stage22-validation.txt
      - name: Validate messaging engine boundaries
        run: |
          set -o pipefail
          node scripts/validate-messaging-boundaries.mjs 2>&1 | tee messaging-boundaries-validation.txt
      - name: Validate messaging multiprovider storage
        run: |
          set -o pipefail
          node scripts/validate-messaging-storage.mjs 2>&1 | tee messaging-storage-validation.txt
      - name: Validate messaging gateway skeleton
        run: |
          set -o pipefail
          node scripts/validate-messaging-gateway.mjs 2>&1 | tee messaging-gateway-validation.txt
      - name: Validate messaging session credential store
        run: |
          set -o pipefail
          node scripts/validate-messaging-session-store.mjs 2>&1 | tee messaging-session-store-validation.txt
      - name: Validate messaging runtime lifecycle
        run: |
          set -o pipefail
          node scripts/validate-messaging-runtime-lifecycle.mjs 2>&1 | tee messaging-runtime-validation.txt
      - name: Validate messaging ingress
        run: |
          set -o pipefail
          node scripts/validate-messaging-ingress.mjs 2>&1 | tee messaging-ingress-validation.txt
      - name: Upload structural validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: structural-validation
          path: |
            documentation-validation.txt
            personas-audit-validation.txt
            module-qa-validation.txt
            vaccines-validation.txt
            extension-functions-validation.txt
            operational-qa-validation.txt
            flexible-workflows-validation.txt
            migrations-validation.txt
            stage17-validation.txt
            stage18-validation.txt
            stage19-validation.txt
            stage20-validation.txt
            stage22-validation.txt
            messaging-boundaries-validation.txt
            messaging-storage-validation.txt
            messaging-gateway-validation.txt
            messaging-session-store-validation.txt
            messaging-runtime-validation.txt
            messaging-ingress-validation.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload recent migrations
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: recent-migrations
          path: |
            supabase/migrations/20260720*.sql
            supabase/migrations/20260721*.sql
            supabase/migrations/20260722*.sql
            supabase/migrations/20260728*.sql
            supabase/migrations/20260729*.sql
            supabase/migrations/20260803*.sql
            supabase/migrations/20260804*.sql
          if-no-files-found: warn
          retention-days: 7

  quality:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-build-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SIGNATURE_PROVIDER: sandbox
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Start PostgreSQL test service
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "alter user postgres password 'postgres';"
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --no-frozen-lockfile --ignore-scripts --reporter=append-only
      - name: Verify resolved W-06 lockfile
        run: pnpm validate:messaging-lockfile
      - name: Upload resolved W-06 lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-lock-w06
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
      - name: Validate engineering vaccines
        run: pnpm validate:vaccines
      - name: Validate dead exports
        run: pnpm validate:exports-mortos
      - name: Validate assertion policy
        run: pnpm validate:assercoes
      - name: Validate canonical documentation
        run: pnpm validate:docs
      - name: Validate server actions exports (VACINA-047)
        run: pnpm validate:server-actions
      - name: Validate PostgREST embeds (VACINA-052)
        run: pnpm validate:postgrest-embeds
      - name: Validate module keys against app_modules (VACINA-053)
        run: pnpm validate:module-keys
      - name: Validate module catalog across registry, app_modules and menus (VACINA-064)
        run: pnpm validate:modulos-semeados
      - name: Validate security definer functions guard the organization (VACINA-065)
        run: pnpm validate:definer-com-guarda
      - name: Validate EXECUTE is revoked from PUBLIC (VACINA-004)
        run: pnpm validate:execute-revogado
      - name: Validate asserted numbers in canonical docs (VACINA-067)
        run: pnpm validate:numeros-afirmados
      - name: Validate multiline form input is newline-normalized (VACINA-048)
        run: pnpm validate:crlf-normalizado
      - name: Validate queries against real table columns (VACINA-036)
        run: pnpm validate:colunas-existentes
      - name: Validate vaccines do not declare absent prevention
        run: pnpm validate:prevencao-declarada
      - name: Validate code map against the code
        run: pnpm validate:code-map
      - name: Validate migrations against the applied ledger (VACINA-057)
        run: pnpm validate:migrations-applied
      - name: Validate auditable persona contracts
        run: pnpm validate:personas-audit
      - name: Validate module adjustment and capture inventory
        run: pnpm validate:module-qa
      - name: Validate extension function qualification
        run: pnpm validate:extension-functions
      - name: Validate operational QA guards
        run: pnpm validate:operational-qa
      - name: Validate flexible commercial workflows
        run: pnpm validate:flexible-workflows
      - name: Validate Stage 9 structure
        run: pnpm validate:stage9
      - name: Validate Stage 12 structure
        run: pnpm validate:stage12
      - name: Validate Stage 12.1 modular access
        run: pnpm validate:stage12.1
      - name: Validate Stage 12.2 advanced signatures
        run: pnpm validate:stage12.2
      - name: Validate Stage 13 quality forms
        run: pnpm validate:stage13
      - name: Validate Stage 14 procurement
        run: pnpm validate:stage14
      - name: Validate Stage 15 operational finance
        run: pnpm validate:stage15
      - name: Validate Stage 16 reports
        run: pnpm validate:stage16
      - name: Validate Stage 17 inventory
        run: pnpm validate:stage17
      - name: Validate Stage 18 relationship
        run: pnpm validate:stage18
      - name: Validate Stage 19 observability
        run: pnpm validate:stage19
      - name: Validate Stage 20 production readiness
        run: pnpm validate:stage20
      - name: Validate Stage 22 WhatsApp omnichannel
        run: pnpm validate:stage22
      - name: Validate messaging engine boundaries
        run: pnpm validate:messaging-boundaries
      - name: Validate messaging multiprovider storage
        run: pnpm validate:messaging-storage
      - name: Validate messaging gateway skeleton
        run: pnpm validate:messaging-gateway
      - name: Validate messaging session credential store
        run: pnpm validate:messaging-session-store
      - name: Validate messaging runtime lifecycle
        run: pnpm validate:messaging-runtime
      - name: Validate messaging ingress
        run: pnpm validate:messaging-ingress
      - name: Validate execution inventory
        run: pnpm validate:inventory
      - name: Validate Object Runtime invariants
        run: pnpm validate:object-runtime
      - name: Validate pipeline invariants
        run: pnpm validate:pipeline
      - name: Validate module menu destinations
        run: pnpm validate:menus
      - name: Schedule dependency database tests
        run: pnpm test:db:planejamento
      - name: Pipeline database tests
        run: pnpm test:db:pipeline
      - name: Operational event and notification database tests
        run: pnpm test:db:operations
      - name: Budget composition and approval database tests
        run: pnpm test:db:budgets
      - name: Commercial documents database tests
        run: pnpm test:db:commercial-documents
      - name: Messaging multiprovider database tests
        run: pnpm test:db:messaging-multiprovider
      - name: Messaging session credential database tests
        run: pnpm test:db:messaging-session-store
      - name: Messaging runtime lease database tests
        run: pnpm test:db:messaging-runtime
      - name: Messaging ingress database tests
        run: pnpm test:db:messaging-ingress
      - name: Messaging gateway unit tests
        run: pnpm test:messaging-gateway
      - name: Baileys adapter contract tests
        run: pnpm test:messaging-baileys
      - name: Messaging session credential store tests
        run: pnpm test:messaging-session-store
      - name: Messaging runtime lifecycle tests
        run: pnpm test:messaging-runtime
      - name: Messaging ingress tests
        run: pnpm test:messaging-ingress
      - name: Lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint-report.txt
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: lint-report.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck-report.txt
      - name: Upload TypeScript report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typecheck-report
          path: typecheck-report.txt
          if-no-files-found: warn
          retention-days: 7
      - name: TypeScript unit tests
        run: pnpm test
      - name: Python quality form tests
        run: pnpm test:python
      - name: Build messaging gateway
        run: pnpm build:messaging-gateway
      - name: Messaging gateway container smoke test
        run: pnpm test:container:messaging-gateway
      - name: Build
        run: pnpm build
