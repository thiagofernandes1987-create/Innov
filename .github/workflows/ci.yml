name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-build-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SIGNATURE_PROVIDER: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Validate Stage 9 structure
        run: pnpm validate:stage9

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm typecheck > /tmp/typecheck.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 140 /tmp/typecheck.log
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              {
                echo "### Diagnóstico temporário do TypeScript"
                echo
                echo '```text'
                tail -n 140 /tmp/typecheck.log
                echo '```'
              } > /tmp/typecheck-comment.md
              gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/typecheck-comment.md
            fi
            exit "$status"
          fi
          cat /tmp/typecheck.log

      - name: Unit tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm test > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/test.log
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              {
                echo "### Diagnóstico temporário dos testes"
                echo
                echo '```text'
                tail -n 120 /tmp/test.log
                echo '```'
              } > /tmp/test-comment.md
              gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/test-comment.md
            fi
            exit "$status"
          fi
          cat /tmp/test.log

      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm build > /tmp/build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 140 /tmp/build.log
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              {
                echo "### Diagnóstico temporário do build"
                echo
                echo '```text'
                tail -n 140 /tmp/build.log
                echo '```'
              } > /tmp/build-comment.md
              gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/build-comment.md
            fi
            exit "$status"
          fi
          cat /tmp/build.log
