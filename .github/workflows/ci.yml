name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-build-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SIGNATURE_PROVIDER: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Validate Stage 9 structure
        run: pnpm validate:stage9

      - name: Validate Stage 12 structure
        run: pnpm validate:stage12

      - name: Validate Stage 12.1 modular access
        run: pnpm validate:stage12.1

      - name: Validate Stage 12.2 advanced signatures
        run: pnpm validate:stage12.2

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload typecheck diagnostics
        if: steps.typecheck.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error

      - name: Fail on typecheck errors
        if: steps.typecheck.outputs.status != '0'
        run: exit 1

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
