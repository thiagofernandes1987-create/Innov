name: QA Fixture do Planejamento

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: URL imutável e compartilhável de /amostra-planejamento
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qa-planning-fixture-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PREVIEW_URL: ${{ inputs.preview_url }}
      QA_OUTPUT_DIR: artifacts/planning-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate immutable preview URL
        run: |
          case "$PREVIEW_URL" in
            https://innov-git-*) echo "Use a URL imutável do deployment, não o alias do branch." >&2; exit 1 ;;
            https://*.vercel.app/amostra-planejamento*) ;;
            *) echo "URL de preview inválida para a fixture do Planejamento." >&2; exit 1 ;;
          esac

      - name: Install Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Capture planning matrix
        run: node scripts/run-planning-fixture-qa.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: planning-fixture-${{ github.run_id }}
          path: artifacts/planning-fixture/
          if-no-files-found: warn
          retention-days: 30
