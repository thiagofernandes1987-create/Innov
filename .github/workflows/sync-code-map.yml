name: Sync Code Map

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Generate canonical code map
        run: node scripts/gerar-mapa-do-codigo.mjs
      - name: Commit code map when changed
        run: |
          if git diff --quiet -- diretrizes/MAPA-DO-CODIGO.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diretrizes/MAPA-DO-CODIGO.md
          git commit -m "docs(code-map): registra portas de recursos operacionais"
          git push origin HEAD:${{ github.head_ref }}
