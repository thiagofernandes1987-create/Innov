name: Sync Code Map

on:
  push:
    branches:
      - audit/regressao-main-20260808

permissions:
  contents: write

concurrency:
  group: sync-code-map-audit-regression
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/regressao-main-20260808
          fetch-depth: 0
      - name: Generate canonical map
        run: node scripts/gerar-mapa-do-codigo.mjs
      - name: Commit generated map when needed
        shell: bash
        run: |
          if git diff --quiet -- diretrizes/MAPA-DO-CODIGO.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diretrizes/MAPA-DO-CODIGO.md
          git commit -m "docs: sync canonical code map"
          git push origin HEAD:audit/regressao-main-20260808
