name: Sync Code Map

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: sync-code-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Generate canonical code map
        run: node scripts/gerar-mapa-do-codigo.mjs

      - name: Commit code map when changed
        shell: bash
        run: |
          if git diff --quiet -- diretrizes/MAPA-DO-CODIGO.md; then
            echo "Mapa já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diretrizes/MAPA-DO-CODIGO.md
          git commit -m "docs(code-map): sincroniza mapa após convergência"
          git push origin HEAD:${{ github.head_ref }}
