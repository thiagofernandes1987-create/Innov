name: Sync Code Map

on:
  push:
    branches:
      - audit/regressao-main-20260808

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/regressao-main-20260808
          fetch-depth: 0
      - name: Regenerate canonical map
        run: node scripts/gerar-mapa-do-codigo.mjs
      - name: Commit map if changed
        run: |
          if git diff --quiet -- diretrizes/MAPA-DO-CODIGO.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diretrizes/MAPA-DO-CODIGO.md
          git commit -m "docs(audit): sincroniza mapa canônico"
          git push origin HEAD:audit/regressao-main-20260808
