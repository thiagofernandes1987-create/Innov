name: Sync Code Map (temporary)

on:
  push:
    branches:
      - audit/regressao-main-20260808
    paths:
      - "app/actions/**"
      - "tests/security-controls.test.ts"
      - ".github/workflows/sync-code-map.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/regressao-main-20260808
      - name: Regenerate canonical code map
        run: node scripts/gerar-mapa-do-codigo.mjs
      - name: Commit generated map when changed
        shell: bash
        run: |
          if git diff --quiet -- diretrizes/MAPA-DO-CODIGO.md; then
            echo "Mapa já sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diretrizes/MAPA-DO-CODIGO.md
          git commit -m "docs: sync canonical code map"
          git push origin HEAD:audit/regressao-main-20260808
