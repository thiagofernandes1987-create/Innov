name: RH eSocial Restricted Homologation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_NO_WARNINGS: "1"
  ESOCIAL_XSD_DIR: /tmp/esocial-xsd
  ESOCIAL_XSD_ZIP: /tmp/esocial-xsd.zip
  ESOCIAL_XSD_SHA256: 32535dba33d0470cf44afce410840af450028fd32d3ddf9123f601c45cf9af8e
  ESOCIAL_XSD_URL: https://www.gov.br/esocial/pt-br/documentacao-tecnica/manuais/2026-07-01_esquemas_xsd_v_s_01_03_00.zip
  ESOCIAL_XSD_DOWNLOAD_URL: https://www.gov.br/esocial/pt-br/documentacao-tecnica/manuais/2026-07-01_esquemas_xsd_v_s_01_03_00.zip/@@download/file

jobs:
  homologate:
    name: producao-restrita-real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rh-esocial-restricted
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Restore pinned official eSocial XSD cache
        uses: actions/cache@v4
        with:
          path: /tmp/esocial-xsd.zip
          key: esocial-xsd-s1-3-20260701-32535dba33d0470cf44afce410840af450028fd32d3ddf9123f601c45cf9af8e
      - name: Install official XML validation tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxml2-utils xmlsec1 openssl unzip >/dev/null
          bash scripts/fetch-rh-esocial-xsd.sh
          xmlsec1 --version
      - name: Validate real homologation runner before secrets/network
        env:
          ESOCIAL_HOMOLOGATION_PREFLIGHT_ONLY: "true"
        run: node --experimental-strip-types scripts/run-rh-esocial-restricted-homologation.mjs
      - name: Refuse production configuration
        shell: bash
        run: |
          if [ "${ESOCIAL_ENABLE_PRODUCTION:-false}" = "true" ]; then
            echo "Este workflow é exclusivo de Produção Restrita." >&2
            exit 1
          fi
      - name: Validate required restricted secrets
        shell: bash
        env:
          ESOCIAL_CERTIFICATE_PFX_BASE64: ${{ secrets.ESOCIAL_CERTIFICATE_PFX_BASE64 }}
          ESOCIAL_SIGNING_CERTIFICATE_PEM: ${{ secrets.ESOCIAL_SIGNING_CERTIFICATE_PEM }}
          ESOCIAL_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.ESOCIAL_SIGNING_PRIVATE_KEY_PEM }}
          ESOCIAL_HOMOLOGATION_UNSIGNED_EVENT_BASE64: ${{ secrets.ESOCIAL_HOMOLOGATION_UNSIGNED_EVENT_BASE64 }}
          ESOCIAL_HOMOLOGATION_EMPLOYER_TYPE: ${{ secrets.ESOCIAL_HOMOLOGATION_EMPLOYER_TYPE }}
          ESOCIAL_HOMOLOGATION_EMPLOYER_NUMBER: ${{ secrets.ESOCIAL_HOMOLOGATION_EMPLOYER_NUMBER }}
          ESOCIAL_TRANSMITTER_REGISTRATION_TYPE: ${{ secrets.ESOCIAL_TRANSMITTER_REGISTRATION_TYPE }}
          ESOCIAL_TRANSMITTER_REGISTRATION_NUMBER: ${{ secrets.ESOCIAL_TRANSMITTER_REGISTRATION_NUMBER }}
        run: |
          required=(ESOCIAL_CERTIFICATE_PFX_BASE64 ESOCIAL_SIGNING_CERTIFICATE_PEM ESOCIAL_SIGNING_PRIVATE_KEY_PEM ESOCIAL_HOMOLOGATION_UNSIGNED_EVENT_BASE64 ESOCIAL_HOMOLOGATION_EMPLOYER_TYPE ESOCIAL_HOMOLOGATION_EMPLOYER_NUMBER ESOCIAL_TRANSMITTER_REGISTRATION_TYPE ESOCIAL_TRANSMITTER_REGISTRATION_NUMBER)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then echo "Secret ausente: $name" >&2; exit 1; fi
          done
      - name: Execute real Restricted Production exchange
        env:
          ESOCIAL_CERTIFICATE_PFX_BASE64: ${{ secrets.ESOCIAL_CERTIFICATE_PFX_BASE64 }}
          ESOCIAL_CERTIFICATE_PASSPHRASE: ${{ secrets.ESOCIAL_CERTIFICATE_PASSPHRASE }}
          ESOCIAL_SIGNING_CERTIFICATE_PEM: ${{ secrets.ESOCIAL_SIGNING_CERTIFICATE_PEM }}
          ESOCIAL_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.ESOCIAL_SIGNING_PRIVATE_KEY_PEM }}
          ESOCIAL_HOMOLOGATION_UNSIGNED_EVENT_BASE64: ${{ secrets.ESOCIAL_HOMOLOGATION_UNSIGNED_EVENT_BASE64 }}
          ESOCIAL_HOMOLOGATION_EMPLOYER_TYPE: ${{ secrets.ESOCIAL_HOMOLOGATION_EMPLOYER_TYPE }}
          ESOCIAL_HOMOLOGATION_EMPLOYER_NUMBER: ${{ secrets.ESOCIAL_HOMOLOGATION_EMPLOYER_NUMBER }}
          ESOCIAL_TRANSMITTER_REGISTRATION_TYPE: ${{ secrets.ESOCIAL_TRANSMITTER_REGISTRATION_TYPE }}
          ESOCIAL_TRANSMITTER_REGISTRATION_NUMBER: ${{ secrets.ESOCIAL_TRANSMITTER_REGISTRATION_NUMBER }}
          ESOCIAL_HOMOLOGATION_EVENT_GROUP: ${{ vars.ESOCIAL_HOMOLOGATION_EVENT_GROUP || '1' }}
        run: node --experimental-strip-types scripts/run-rh-esocial-restricted-homologation.mjs
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rh-esocial-restricted-evidence-${{ github.run_id }}
          path: .evidence/rh/esocial-restricted-homologation.json
          if-no-files-found: warn
          retention-days: 30
