- finding_id: FND-0012
  title: Artefatos gerados não ignorados pelo versionamento
  dimension: DIM-11
  severity: LOW
  confidence: CONFIRMED
  statement_type: OBSERVED_FACT
  origin: R3A_BLIND_DETECTOR_D11
  evidence_ids:
  - EVD-R3A-D11
  description: O .gitignore cobre node_modules, .next, out, coverage, .env*, logs,
    .vercel e supabase/.temp, mas não cobre tsconfig.tsbuildinfo nem __pycache__.
    Ambos são gerados por comandos do próprio CI (pnpm typecheck e pnpm test:python)
    e aparecem como não rastreados após uma execução local.
  impact: Risco de commit acidental de artefato de build e ruído em revisões.
  status: OPEN
  final_outcome: REPORTED_NOT_REMEDIATED
  note: 'Descoberto após o congelamento do R1 e registrado como novo, sem retroalimentar
    a rodada congelada (invariante NO_CROSS_PROMPT_BACKFLOW_WITHIN_SAME_CYCLE). Não
    remediado nesta rodada: alterar .gitignore fora de uma decisão do responsável
    poderia mascarar arquivos que o projeto queira inspecionar.'
