  blind_detector: D09
- finding_id: FND-0009
  title: Variáveis de provedores de assinatura declaradas e nunca consumidas
  dimension: DIM-07
  severity: LOW
  confidence: CONFIRMED
  statement_type: OBSERVED_FACT
  evidence_ids:
  - EVD-0016
  - EVD-0017
  description: Três segredos de provedores de assinatura constam do .env.example sem
    nenhum consumidor no código. O operador é induzido a provisionar e rotacionar
    segredos que o sistema não utiliza.
  impact: Superfície de segredo desnecessária e ruído operacional.
  executability: EXECUTABLE_LOCALLY
  status: CLOSED_WITH_OUTCOME
  round: R1
  final_outcome: REMEDIATED
  reconciliation_note: 'As três variáveis passaram a ser marcadas explicitamente como
    reservadas em .env.example. O detector cego continua sinalizando porque sua heurística
    de anotação procura a palavra ''não'' no comentário imediatamente anterior; é
    limitação do detector, não do artefato. Evidência direta: bloco de comentário
    ''Reservadas para provedores externos ainda não integrados'' acima das três variáveis.'
  blind_detector: D08
