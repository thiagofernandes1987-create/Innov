{{- if and .Values.eventPublisher.enabled .Values.eventPublisher.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ .Release.Name }}-event-publisher}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ .Release.Name }}-event-publisher}
  minReplicas: {{ .Values.eventPublisher.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.eventPublisher.autoscaling.maxReplicas }}
  metrics:
    - type: External
      external:
        metric: {name: innovar_outbox_ready_messages}
        target: {type: AverageValue, averageValue: "{{ .Values.eventPublisher.autoscaling.targetBacklogPerPod }}"}
{{- end }}
