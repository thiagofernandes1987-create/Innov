name: executable-spec-integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: executable-spec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.13', cache: pip}
      - name: Dependency lock gate (fail closed)
        run: python scripts/validate_dependency_locks.py
      - name: OCI image digest gate (fail closed)
        run: python scripts/validate_image_references.py
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
      - run: python scripts/validate_round2.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - run: bash scripts/check_sdk_drift.sh
      - name: SDK compile from verified lockfile
        run: cd 06-sdk/typescript && npm ci --ignore-scripts --no-audit --no-fund && npm exec tsc -- --noEmit
      - name: XState official runtime from verified lockfile
        run: cd tools/xstate-runtime && npm ci --ignore-scripts --no-audit --no-fund && npm test
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4 # BLOCKED_EXTERNAL: replace tag with verified digest before protected release
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: innovar_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d innovar_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/innovar_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.13', cache: pip}
      - name: Dependency lock gate (fail closed)
        run: python scripts/validate_dependency_locks.py
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
      - run: python scripts/test_postgres_event_transport.py
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with: {version: v3.16.4}
      - run: helm lint 05-infra/helm
      - run: helm template innovar 05-infra/helm --namespace innovar > rendered.yaml
      - uses: docker://ghcr.io/yannh/kubeconform:v0.7.0 # BLOCKED_EXTERNAL: resolve OCI digest before protected release
        with:
          args: -strict -summary -kubernetes-version 1.31.0 /github/workspace/rendered.yaml
